name: Publish KSign Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub's shortest scheduling interval is five minutes.
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog parser
        run: npm test
      - name: Refresh AppleJr catalog (preserves snapshot if unavailable)
        run: node scripts/update-catalog.mjs
      - name: Store catalog changes
        run: |
          if ! git diff --quiet -- site/catalog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/catalog.json
            git commit -m 'Update AppleJr catalog'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
